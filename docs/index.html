<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pressure Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#101010;--panel:#1a1a19;--panel2:#232321;--panel3:#2b2b28;--line:#383835;--line2:#2c2c2a;
  --text:#f0efec;--text2:#c3c2b7;--muted:#8e8d86;
  --blue:#3987e5;--orange:#d95926;--aqua:#199e70;--yellow:#c98500;--magenta:#d55181;--green:#0ca30c;--violet:#9085e9;--red:#e66767;
  --accent:#d55181;--good:#0ca30c;--bad:#e66767;--mid:#383835;
  --r:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:58px minmax(0,1fr);overflow:hidden}
a{color:var(--blue);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
/* sidebar */
#side{grid-row:1/3;background:#141413;border-right:1px solid var(--line2);display:flex;flex-direction:column;min-height:0}
.brand{height:58px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line2)}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#7a2c8f);display:grid;place-items:center;font-weight:800;font-size:13px}
.brand b{font-size:15px;letter-spacing:.2px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:-2px}
#nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
#nav .grp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 10px 4px}
#nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--text2);font-weight:500;text-decoration:none}
#nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav a:hover{background:var(--panel2);color:var(--text)}
#nav a.on{background:var(--panel3);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.sidefoot{margin-top:auto;padding:12px 18px;color:var(--muted);font-size:11.5px;border-top:1px solid var(--line2)}
/* top bar */
#top{display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line2);background:#141413;min-width:0}
#burger{display:none;background:none;border:0;padding:6px;cursor:pointer}
#crumb{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#crumb span{color:var(--muted);font-weight:500}
.search{margin-left:auto;position:relative;width:min(420px,46vw)}
.search input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px 8px 34px;color:var(--text);font:inherit;outline:none}
.search input:focus{border-color:var(--blue)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:11px Inter;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
#results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px #0009;max-height:60vh;overflow:auto;z-index:30;display:none}
#results .g{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 12px 2px}
#results a{display:flex;align-items:center;gap:10px;padding:7px 12px;color:var(--text);text-decoration:none}
#results a:hover,#results a.sel{background:var(--panel3)}
#results a small{color:var(--muted);margin-left:auto}
/* main */
#main{min-height:0;min-width:0;overflow:hidden;padding:16px 18px}
.page{height:100%;display:grid;gap:14px;min-height:0;min-width:0}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;min-width:0}
.card>.hd{padding:12px 16px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card>.hd h3{margin:0;font-size:13.5px;font-weight:600}
.card>.hd .sub{color:var(--muted);font-size:12px}
.card>.hd .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card>.bd{padding:0 16px 14px;overflow:auto;flex:1;min-height:0}
.scroll{overflow:auto;min-height:0}
/* controls */
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{background:none;border:0;padding:5px 12px;border-radius:7px;cursor:pointer;color:var(--text2);font-weight:500;font-size:12.5px}
.seg button[aria-pressed=true]{background:var(--panel3);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line2);padding:0 16px;overflow-x:auto;flex:none}
.tabs button{background:none;border:0;padding:10px 12px;cursor:pointer;color:var(--text2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
input.f,select.f{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--text);font:inherit;font-size:12.5px;outline:none}
input.f:focus,select.f:focus{border-color:var(--blue)}
/* tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.3px}
.kpi .l{color:var(--muted);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.tile{background:var(--panel2);border-radius:10px;padding:9px 11px}
.tile .v{font-size:17px;font-weight:700}
.tile .l{color:var(--muted);font-size:11.5px;line-height:1.25}
.tile.sm .v{font-size:13.5px;font-weight:600}
.tile .v small{font-size:12px;color:var(--text2);font-weight:500}
/* avatars */
.av{border-radius:50%;object-fit:cover;flex:none;background:var(--panel3);display:grid;place-items:center;font-weight:700;color:#fff;overflow:hidden}
.av.ini{background:linear-gradient(135deg,#3a3a37,#2a2a28);color:var(--text2)}
.rk{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:12px;padding:0 6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--panel3);color:var(--text2);white-space:nowrap}
.chip.ipl{background:#c9850026;color:#e7b04a}.chip.t20i{background:#199e7026;color:#4cc59a}.chip.oth{background:#9085e926;color:#b3abf0}
.chip.top{background:#d5518126;color:#ec8db0}
/* lists */
.list{display:flex;flex-direction:column;gap:2px}
.li{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:9px;cursor:pointer;min-width:0}
.li:hover{background:var(--panel2)}
.li.on{background:var(--panel3);box-shadow:inset 3px 0 0 var(--accent)}
.li .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .meta{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .end{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.minibar{height:4px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
.minibar>i{display:block;height:100%;background:var(--blue);border-radius:2px}
/* tables */
table.t{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.t th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:600;text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
.t th.l,.t td.l{text-align:left}
.t th[aria-sort=ascending]::after{content:" \25B2";font-size:9px}.t th[aria-sort=descending]::after{content:" \25BC";font-size:9px}
.t td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background:var(--panel2)}
.t tr.hl td{background:#d5518114}
.t td .pn{display:flex;align-items:center;gap:8px}
.more{display:block;margin:10px auto 0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 14px;cursor:pointer;color:var(--text2)}
.pos{color:#4cc59a}.neg{color:var(--red)}.mut{color:var(--muted)}
/* hero */
.hero{display:flex;gap:18px;align-items:center;padding:16px 18px;background:linear-gradient(120deg,#26131d 0%,#1a1a19 55%);border-bottom:1px solid var(--line2);border-radius:var(--r) var(--r) 0 0;flex:none}
.hero h1{margin:0;font-size:26px;letter-spacing:-.4px;line-height:1.1}
.hero h1 .n{color:var(--accent);margin-right:6px}
.hero .tag{color:#ec8db0;font-weight:600;margin-top:4px}
.hero .meta{color:var(--text2);font-size:12.5px;margin-top:3px}
.prose{max-width:860px;font-size:13.5px;line-height:1.6;color:var(--text)}
.prose p{margin:0 0 10px}
.box{border-left:3px solid var(--blue);padding:4px 0 4px 14px;margin:6px 0 16px}
.box.down{border-color:var(--red)}
.box h4{margin:0 0 6px;font-size:13px;color:var(--blue)}.box.down h4{color:var(--red)}
.box ul{margin:0;padding-left:18px}.box li{margin:3px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.sec{margin:14px 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin:4px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--text2);font:12px Inter,system-ui,sans-serif}
.chart{width:100%;min-width:0}
svg .gl{stroke:var(--line2)}svg .ax{stroke:var(--line)}
#tip{position:fixed;pointer-events:none;background:#000e;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;z-index:50;display:none;max-width:300px}
#tip b{display:block;margin-bottom:2px}
.empty{color:var(--muted);padding:30px;text-align:center}
.fig{background:#fcfcfb;border-radius:10px;padding:6px;cursor:zoom-in}
.fig img{width:100%;display:block;border-radius:6px}
.figcap{color:var(--text2);font-size:12px;margin:6px 2px 0}
#lightbox{position:fixed;inset:0;background:#000c;display:none;place-items:center;z-index:60;cursor:zoom-out;padding:3vw}
#lightbox img{max-width:100%;max-height:100%;border-radius:8px;background:#fcfcfb}
.formula{background:var(--panel2);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.formula .eq{font:14px/1.8 "Cambria Math","STIX Two Math",Georgia,serif;color:#fff;margin:4px 0}
.formula h4{margin:0 0 4px;font-size:13.5px}.formula h4 span{color:var(--accent);margin-right:6px}
.formula p{margin:6px 0 0;color:var(--text2);font-size:12.8px}
.heat td{text-align:center;font-weight:600;min-width:46px}
/* mobile */
@media (max-width:980px){
  body{grid-template-columns:1fr;overflow:auto;height:auto}
  #side{position:fixed;inset:0 auto 0 0;width:240px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  body.navopen #side{transform:none;box-shadow:0 0 40px #000}
  #burger{display:block}
  #main{overflow:visible;padding:12px}
  .page{height:auto;grid-template-columns:1fr!important;grid-template-rows:none!important}
  .card{max-height:none}.card>.bd{overflow:visible}
  .search{width:auto;flex:1}.search kbd{display:none}
}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><div class="logo">PL</div><div><b>Pressure Lab</b><small>SupeRR Selector S2</small></div></div>
  <nav id="nav" aria-label="Main"></nav>
  <div class="sidefoot" id="sidefoot"></div>
</aside>
<header id="top">
  <button id="burger" aria-label="Open menu"><svg width="22" height="22" viewBox="0 0 24 24" stroke="#c3c2b7" stroke-width="2" fill="none"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <div id="crumb"></div>
  <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="Search players, teams, grounds…" autocomplete="off" aria-label="Search"><kbd>/</kbd>
    <div id="results" role="listbox"></div></div>
</header>
<main id="main"></main>
<div id="tip"></div>
<div id="lightbox"><img alt=""></div>
<script src="data.js"></script>
<script>
"use strict";
const D = window.DATA;
// ------------------------------------------------------------------ basics
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function el(tag, a = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(a || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "html") e.innerHTML = v; else if (k === "style") e.style.cssText = v;

  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));

}
const NS = "http://www.w3.org/2000/svg";
function sv(tag, a = {}, text) { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(a)) if (v != null) e.setAttribute(k, v); if (text != null) e.textContent = text; return e; }
const isNum = (x) => typeof x === "number" && isFinite(x);
const f = (x, d = 1) => isNum(x) ? x.toFixed(d) : "–";
const f0 = (x) => isNum(x) ? Math.round(x).toLocaleString("en") : "–";
const pct = (x, d = 0) => isNum(x) ? (100 * x).toFixed(d) + "%" : "–";
const sgn = (x, d = 2) => isNum(x) ? (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(d) : "–";
const ov = (b) => isNum(b) ? Math.floor(b / 6) + (b % 6 ? "." + (b % 6) : "") : "–";
const dfmt = (s) => { if (!s) return "–"; const d = new Date(s + "T00:00:00"); return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); };
const by = (arr, k) => { const m = new Map(); for (const r of arr) { const key = String(r[k]); if (!m.has(key)) m.set(key, []); m.get(key).push(r); } return m; };
const idx = (arr, k) => new Map(arr.map((r) => [String(r[k]), r]));
const CSS = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || v;
const COL = { blue: "#3987e5", orange: "#d95926", aqua: "#199e70", yellow: "#c98500", magenta: "#d55181", green: "#0ca30c", violet: "#9085e9", red: "#e66767", gray: "#6d6c66", grid: "#2c2c2a", line: "#383835" };
const compChip = (c) => el("span", { class: "chip " + (c === "IPL" ? "ipl" : c === "T20I" ? "t20i" : "oth") }, c || "–");

// ------------------------------------------------------------------ indexes
const NAME = D.names;
const BAT = idx(D.bat, "pid"), BOWL = idx(D.bowl, "pid");
const RB = idx(D.rbat, "pid"), RW = idx(D.rbowl, "pid");
const PR = idx(D.pr, "pid");
const NARR = D.narr || {}, PHOTO = D.photos || {};
const G = {
  batSeason: by(D.batSeason, "pid"), bowlSeason: by(D.bowlSeason, "pid"), batPhase: by(D.batPhase, "pid"), bowlPhase: by(D.bowlPhase, "pid"),
  batVs: by(D.batVs, "pid"), bowlVs: by(D.bowlVs, "pid"), dism: by(D.dism, "pid"), wkHow: by(D.wkHow, "pid"),
  batTeam: by(D.batTeam, "pid"), bowlTeam: by(D.bowlTeam, "pid"), batVenue: by(D.batVenue, "pid"), bowlVenue: by(D.bowlVenue, "pid"),
  muBat: by(D.matchups, "bat"), muBowl: by(D.matchups, "bowl"), bestBat: by(D.bestBat, "pid"), bestBowl: by(D.bestBowl, "pid"),
  svBat: by(D.seasonVal.bat, "pid"), svBowl: by(D.seasonVal.bowl, "pid"), bigBat: idx(D.bigBat, "pid"), bigBowl: idx(D.bigBowl, "pid"),
  teamHist: by(D.teamHist, "team"), teamBat: by(D.teamBat, "tname"), teamBowl: by(D.teamBowl, "tname"),
  venueBat: by(D.venueBat, "venue"), venueBowl: by(D.venueBowl, "venue"), h2h: by(D.h2h, "team"),
};
const MATCH = idx(D.matches, "id");
const TEAMS = idx(D.teams, "team"), TNOW = idx(D.teamNow, "team"), VEN = idx(D.venues, "id");
const TOP = { bat: D.rbat.filter((r) => r.final_rank <= 10).sort((a, b) => a.final_rank - b.final_rank),
              bowl: D.rbowl.filter((r) => r.final_rank <= 10).sort((a, b) => a.final_rank - b.final_rank) };
const R = { bat: D.rbat, bowl: D.rbowl };
const COMPS = { bat: ["P", "A", "F", "S", "B", "D", "C", "M"], bowl: ["P", "R", "S", "B", "D", "C", "M"] };
const CLAB = { P: "Pressure value", A: "Anchor credit", F: "Finisher rate", S: "Team share", B: "Big-match value", D: "Gap vs own normal", C: "Match consistency", M: "Experience", R: "Economy vs team-mates" };
const CDESC = { P: "runs above an average player per ball, tense balls counted more", A: "dismissals avoided on pressure balls vs an average batter", F: "not out at the end of won pressure chases", S: "share of the team's pressure runs / wickets in the innings", B: "value in important matches (finals, knockouts, deciders)", D: "pressure level minus own normal level", C: "share of matches positive under pressure", M: "length of the pressure record (matches)", R: "runs per ball saved vs team-mates on pressure balls" };
const W = { bat: { P: .25, A: .2, F: .1, S: .15, B: .1, D: .05, C: .05, M: .1 }, bowl: { P: .35, R: .15, S: .1, B: .1, D: .1, C: .1, M: .1 } };
const compRank = {};
for (const side of ["bat", "bowl"]) { compRank[side] = {}; for (const c of COMPS[side]) { const xs = R[side].map((r) => r[c]).sort((a, b) => b - a); compRank[side][c] = (v) => xs.findIndex((x) => x <= v) + 1; } }
const pname = (pid) => NAME[String(pid)] || (BAT.get(String(pid)) || BOWL.get(String(pid)) || {}).name || "Player " + pid;
const topOf = (pid) => { const a = RB.get(String(pid)), b = RW.get(String(pid)); return { bat: a && a.final_rank <= 10 ? a : null, bowl: b && b.final_rank <= 10 ? b : null }; };
const PLAYERS = (() => {
  const ids = new Set([...BAT.keys(), ...BOWL.keys()]);
  return [...ids].map((id) => { const b = BAT.get(id), w = BOWL.get(id); return { pid: id, name: pname(id), team: (b || w).team, mat: Math.max(b ? b.mat : 0, w ? w.mat : 0), bat: !!b && b.balls >= 30, bowl: !!w && w.balls >= 60, runs: b ? b.runs : 0, wk: w ? w.wk : 0 }; })
    .sort((a, b) => b.mat - a.mat);
})();
const TEAMNAMES = D.teams.map((t) => t.team).sort();

// ------------------------------------------------------------------ ui bits
function avatar(pid, size = 40) {
  const p = PHOTO[String(pid)];
  if (p) return el("img", { class: "av", src: p, alt: "", style: `width:${size}px;height:${size}px`, loading: "lazy" });
  const n = pname(pid).split(" ").filter((x) => x[0] && x[0] === x[0].toUpperCase());
  const ini = n.length > 1 ? n[0][0] + n[n.length - 1][0] : (n[0] || "?").slice(0, 2);
  return el("div", { class: "av ini", style: `width:${size}px;height:${size}px;font-size:${Math.round(size * .36)}px` }, ini);
}
const tip = $("#tip");
function showTip(e, html) { tip.innerHTML = html; tip.style.display = "block"; moveTip(e); }
function moveTip(e) { const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY + 14; if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 14; tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px"; }
function hideTip() { tip.style.display = "none"; }
function tipOn(node, html) { node.addEventListener("mouseenter", (e) => showTip(e, typeof html === "function" ? html() : html)); node.addEventListener("mousemove", moveTip); node.addEventListener("mouseleave", hideTip); }
function card(title, sub, body, opt = {}) {
  const hd = el("div", { class: "hd" }, el("h3", {}, title), sub ? el("span", { class: "sub" }, sub) : null, opt.right ? el("div", { class: "right" }, opt.right) : null);
  const bd = el("div", { class: "bd" + (opt.bdClass ? " " + opt.bdClass : "") }, body);
  return el("div", { class: "card", style: opt.style || "" }, title ? hd : null, bd);
}

    add("Teams", tm, (t) => el("a", { href: "#/teams/" + encodeURIComponent(t) }, t, el("small", {}, (TEAMS.get(t) || {}).comp || "")));
    add("Grounds", gr, (v) => el("a", { href: "#/grounds/" + v.id }, v.label, el("small", {}, v.home || "")));

    el("div", {}, sec("Pace and spin"), table([{ k: "k", h: "", l: 1 }, { k: "w", h: "Wickets" }, { k: "e", h: "Economy", f: (x) => f(x.e, 2) }], [{ k: "Pace", w: v.wk_pace, e: v.econ_pace }, { k: "Spin", w: v.wk_spin, e: v.econ_spin }]),
      sec("Leading run-scorers"), table([{ k: "pid", h: "Batter", l: 1, f: (x) => pcell(x.pid) }, { k: "inn", h: "Inn" }, { k: "runs", h: "Runs" }, { k: "hs", h: "HS" }], G.venueBat.get(id) || [], { sort: "runs", onRow: (x) => go("player/" + x.pid) }),

// ================================================================== MATCHES
let MF = { season: "", comp: "", big: false, q: "" };

  const mm0 = MATCH.get(String(id)); crumb("Matches", mm0 ? `${mm0.bat1 || mm0.home} v ${mm0.bat2 || mm0.away}` : "All");
  const p = page("", "grid-template-columns:minmax(0,1fr) 380px");
  const holder = el("div");
  const draw = () => { const ms = D.matches.filter((m) => (!MF.season || m.season === MF.season) && (!MF.comp || m.comp === MF.comp) && (!MF.big || m.imp > 0) && (!MF.q || `${m.home} ${m.away} ${m.series}`.toLowerCase().includes(MF.q)));
    holder.replaceChildren(el("div", { class: "mut", style: "font-size:12px;margin-bottom:6px" }, `${ms.length} matches`), matchTable(ms, { page: 120, hl: (m) => String(m.id) === String(id) })); };
  const ctrl = [el("input", { class: "f", placeholder: "Team or series", value: MF.q, oninput: (e) => { MF.q = e.target.value.toLowerCase(); draw(); } }),
    el("select", { class: "f", onchange: (e) => { MF.season = e.target.value; draw(); } }, el("option", { value: "" }, "All seasons"), D.meta.seasons.map((s) => el("option", { value: s, selected: s === MF.season ? "" : null }, s))),
    el("select", { class: "f", onchange: (e) => { MF.comp = e.target.value; draw(); } }, ["", "IPL", "T20I", "Other T20"].map((c) => el("option", { value: c, selected: c === MF.comp ? "" : null }, c || "All competitions"))),
    el("label", { style: "display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--text2)" }, el("input", { type: "checkbox", checked: MF.big ? "" : null, onchange: (e) => { MF.big = e.target.checked; draw(); } }), "Big matches only")];
  draw();
  p.append(card("Matches", "", holder, { right: ctrl }));
  const m = MATCH.get(String(id));

    det.append(el("div", { style: "display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px" }, compChip(m.comp), m.imp > 0 ? el("span", { class: "chip top" }, m.imp_why) : null, m.stage && !["League", "Others"].includes(m.stage) ? el("span", { class: "chip" }, m.stage) : null));

    for (const [t, s] of [[m.bat1 || m.home, m.s1], [m.bat2 || m.away, m.s2]]) det.append(el("div", { class: "tile", style: "display:flex;align-items:center;gap:10px;margin-bottom:8px" }, el("div", { style: "flex:1" }, el("a", { href: "#/teams/" + encodeURIComponent(t || ""), style: "font-weight:600" }, t || "–"), el("div", { class: "v" }, s || "–")), res(t)));
    det.append(el("p", { style: "font-weight:600;margin:12px 0" }, m.result || ""));
    det.append(el("div", { class: "tiles", style: "grid-template-columns:1fr 1fr" }, [tile(m.top_bat || "–", "top scorer"), tile(m.top_bowl || "–", "best bowling"), tile(m.mom || "–", "Player of the Match"), tile(`${m.toss || "–"}`, `won toss, chose ${(m.toss_opt || "").toLowerCase()}`)].map((t) => (t.classList.add("sm"), t))));
    const perf = [...(D.bestBat.filter((x) => x.match_id === m.id)), ...(D.bestBowl.filter((x) => x.match_id === m.id))];
    if (perf.length) det.append(sec("Notable pressure performances"), el("div", { class: "list" }, perf.sort((a, b) => b.p_val - a.p_val).slice(0, 8).map((x) => el("div", { class: "li", onclick: () => go("player/" + x.pid) }, avatar(x.pid, 30),
      el("div", { style: "min-width:0" }, el("div", { class: "nm" }, pname(x.pid)), el("div", { class: "meta" }, "runs" in x && "out" in x ? `${x.runs}${x.out ? "" : "*"} (${x.balls})` : `${x.wk}/${x.runs} (${ov(x.balls)} ov)`)), el("div", { class: "end" }, sgn(x.p_val, 1))))));

// ================================================================== METHOD
function viewMethod(tab = "formula") {
  crumb("Method", { formula: "The formula", reliability: "Reliability", figures: "Figures" }[tab] || "The formula");
  const p = page("", "grid-template-columns:minmax(0,1fr)");
  const c = el("div", { class: "card" });
  c.append(tabs([["formula", "The formula"], ["reliability", "Reliability"], ["figures", "Figures"]], tab, (k) => go("method/" + k)));
  const body = el("div", { class: "bd", style: "padding-top:16px" }); c.append(body); p.append(c);
  if (tab === "formula") {
    const F = [
      ["1", "Win probability and leverage", "WP<sub>t</sub> = σ(β · x<sub>t</sub>) &nbsp;&nbsp; ΔWP<sub>t</sub> = Σ<sub>o</sub> P(o | phase, innings, wickets) · |WP(s<sub>t</sub> ⊕ o) − WP(s<sub>t</sub>)| &nbsp;&nbsp; Lev<sub>t</sub> = ΔWP<sub>t</sub> / mean ΔWP", "Leverage is how much this ball can swing the result. 1.0 is an average ball. In the first innings it is compared with the average for the same over, so openers are not pressured just for batting first."],
      ["2", "Pressure index", "Π<sub>t</sub> = Lev<sub>t</sub> · (1 + Σ<sub>k</sub> w<sub>k</sub> s<sub>k,t</sub>) &nbsp;&nbsp; pressure ball ⇔ Π<sub>t</sub> ≥ 80th percentile within the innings", "s<sub>k</sub> are situations (required rate ≥ 10, batting out of position, just conceded a boundary …). Each weight w<sub>k</sub> is the measured rise in dismissals and dots (or runs conceded) for the same player, kept only if its 95% interval shows the ball is harder."],
      ["3", "Value of a ball", "v<sup>bat</sup> = (runs − r̂) − c · (out − p̂<sub>out</sub>) &nbsp;&nbsp; v<sup>bowl</sup> = (ĉ − conceded) + c · q · (wicket − p̂<sub>wkt</sub>) &nbsp;&nbsp; c = R(u, w) − R(u, w+1)", "r̂, p̂ come from a model of an average player in the same spot (over, wickets, required rate, ground, era, opponent quality), always fitted on other matches. c is the run cost of a wicket from a DLS-style resource curve R; q scales a wicket by the batter's quality."],
      ["4", "Weights", "ω<sub>t</sub> = 0.5<sup>age/2y</sup> · 2σ(θ<sub>opp</sub> − θ<sub>avg</sub>)", "Recent balls count more, and so do balls against strong sides (about 1.33 for India or England, 0.5 for Zimbabwe), from a Bradley–Terry model of all results."],
      ["5", "Components", "P = Σ ω√Π · v / (Σ ω√Π + k) &nbsp; D = pressure − normal &nbsp; C = positive matches share &nbsp; M = ln(1 + matches) &nbsp; B = big-match value &nbsp; A, F, S (bat) &nbsp; R, S (bowl)", "Every component is shrunk towards an average player (k = noise ÷ signal variance, estimated from the data), so short hot streaks cannot top the list."],
      ["6", "Reliability Index", "I = ½ · I<sub>all matches</sub> + ½ · I<sub>without best match</sub> + bonus &nbsp;&nbsp; I = Σ W<sub>c</sub> · z<sub>c</sub>", "Batters: P 0.25, A 0.20, F 0.10, S 0.15, B 0.10, D 0.05, C 0.05, M 0.10. Bowlers: P 0.35, R 0.15, S 0.10, B 0.10, D 0.10, C 0.10, M 0.10. The bonus (≤ 0.15) rewards players who were positive under pressure season after season."],
      ["7", "Eligibility and final order", "≥ 100 pressure balls · in ≥ 10 matches · played in 2025 or 2026 &nbsp;&nbsp; |I − I<sub>(10)</sub>| ≤ 0.02 ⇒ order by bootstrap P(top 10)", `${D.rbat.length} batters and ${D.rbowl.length} bowlers qualify.`]];
    body.append(el("div", { style: "max-width:1000px" }, F.map(([n, t, eq, txt]) => el("div", { class: "formula" }, el("h4", {}, el("span", {}, n), t), el("div", { class: "eq", html: eq }), el("p", { html: txt })))));
  } else if (tab === "reliability") {
    for (const side of ["bat", "bowl"]) {
      const v = D.variants[side], tops = TOP[side];
      const tbl = el("table", { class: "t heat" }, el("thead", {}, el("tr", {}, el("th", { class: "l" }, "Alternative definition"), el("th", {}, "Overlap"), tops.map((r) => el("th", { title: r.name }, r.name.split(" ").slice(-1)[0])))));
      const tb = el("tbody");
      for (const r of v) { const tr = el("tr", {}, el("td", { class: "l" }, r.variant), el("td", {}, `${r.overlap_top10}/10`));
        tops.forEach((_, i) => { const k = r["rank_of_" + (i + 1)]; const a = isNum(k) ? Math.max(.08, 1 - Math.log(k) / Math.log(60)) : 0; tr.append(el("td", { style: `background:rgba(57,135,229,${a.toFixed(2)});color:${a > .55 ? "#fff" : "var(--text2)"}` }, isNum(k) ? k : "n/e")); });
        tb.append(tr); }
      tbl.append(tb);
      body.append(sec(`${side === "bat" ? "Batters" : "Bowlers"}: rank of each final top-10 player under alternative definitions`), el("div", { class: "scroll" }, tbl));
    }
    body.append(el("div", { class: "prose", style: "margin-top:16px" }, el("p", {}, "Split-half consistency of the index (odd vs even matches): +0.12 for batters, +0.24 for bowlers. The record parts repeat best (matches +0.65 / +0.69, pressure value +0.23 / +0.16, team share +0.22 / +0.21). A pure ‘clutch’ gap is indistinguishable from chance (shuffle test p = 0.46 / 0.37), so the index rewards being consistently good on pressure balls rather than the gap itself."),
      el("p", {}, "Out-of-time check (rated on matches before 2026, scored on 2026): bowlers +0.26 (economy +0.19, wicket rate +0.01); batters +0.09 (batting average +0.20). All intervals are wide."), el("a", { href: "#/method/figures" }, "See the figures →")));
  } else {
    const groups = [["all", "All"], ["pressure", "Pressure"], ["model", "Model"], ["evidence", "Evidence"], ["reliability", "Reliability"]];
    const holder = el("div", { style: "display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px;margin-top:12px" });
    const draw = (g) => holder.replaceChildren(...D.figs.filter((x) => g === "all" || x.group === g).map((x) => el("div", {}, el("div", { class: "fig", onclick: () => { const lb = $("#lightbox"); $("img", lb).src = x.src; lb.style.display = "grid"; } }, el("img", { src: x.src, alt: x.caption, loading: "lazy" })), el("div", { class: "figcap" }, x.caption))));
    body.append(seg(groups, "all", draw), holder); draw("all");
  }
}
